<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiv Shakti Trading - Invoice Software</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#161616; --green:#1f7a35; --green-d:#155727; --gray:#eceff1; --gray-d:#cfd5d9; --line:#9aa3a8;
}
*{box-sizing:border-box}
body{margin:0;background:#d9dee1;font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--black);font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:10;background:var(--black);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:4px solid var(--green)}
.toolbar b{margin-right:10px;font-size:15px;letter-spacing:.5px}
.btn{font-family:inherit;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;background:var(--gray);color:var(--black)}
.btn:hover{filter:brightness(.93)}
.btn.g{background:var(--green);color:#fff}
.btn.k{background:#444;color:#fff}
#folderInfo{font-size:12px;color:#c9d2d6;margin-left:auto;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;right:16px;bottom:16px;background:var(--black);color:#fff;padding:12px 16px;border-left:5px solid var(--green);border-radius:6px;max-width:440px;display:none;z-index:50;line-height:1.4;white-space:pre-line}
/* ---------- sheet ---------- */
.wrap{padding:18px}
.sheet{width:210mm;min-height:297mm;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25);padding:8mm;border:1px solid var(--line)}
input,textarea,select{font:inherit;color:inherit;border:0;background:transparent;width:100%;outline:none;padding:3px 4px;resize:none}
input:hover,textarea:hover,select:hover{background:#f3fbf5}
input:focus,textarea:focus,select:focus{background:#e6f4ea;box-shadow:inset 0 0 0 1px var(--green)}
.v{display:block;padding:3px 4px;white-space:pre-wrap;min-height:1.2em}
.head{display:grid;grid-template-columns:1fr auto;border:2px solid var(--black)}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px;border-right:2px solid var(--black);background:#fff}
.logo img{cursor:pointer}
.logo .lt{flex:1}
.logo .nm{font-size:26px;font-weight:900;letter-spacing:.5px;line-height:1.05;color:var(--black)}
.logo .tg{font-size:13px;font-weight:800;color:var(--green);letter-spacing:.4px}
.logo .mf{font-size:12px}
.title{background:var(--black);color:#fff;font-size:30px;font-weight:800;letter-spacing:1.5px;display:flex;align-items:center;justify-content:center;padding:0 22px;border-bottom:6px solid var(--green)}
.title select{width:auto;font-size:22px;font-weight:800;letter-spacing:1.5px;color:#fff;text-align:center;text-align-last:center;cursor:pointer;-webkit-appearance:none;appearance:none;padding:6px 4px}
.title select:hover,.title select:focus{background:rgba(255,255,255,.12);box-shadow:none}
.title select option{color:#161616;background:#fff;font-size:15px;letter-spacing:0}
.info{display:grid;grid-template-columns:1fr 250px;border:2px solid var(--black);border-top:0}
.info .l{padding:4px 6px;border-right:2px solid var(--black);background:var(--gray)}
.row2{display:grid;grid-template-columns:70px 1fr;align-items:center}
.row2 label{font-weight:700;padding-left:4px}
.meta{display:grid;grid-template-columns:80px 1fr;border-collapse:collapse}
.meta div{border-bottom:1px solid var(--line);padding:3px 4px;display:flex;align-items:center;min-height:28px}
.meta .k{font-weight:700;background:var(--gray-d)}
.band{background:var(--green);color:#fff;text-align:center;font-size:18px;font-weight:700;letter-spacing:3px;padding:3px;border:2px solid var(--black);border-top:0}
.bill{display:grid;grid-template-columns:1fr;border:2px solid var(--black);border-top:0;background:var(--gray)}
.bill .l{padding:6px}
.fl2{display:grid;grid-template-columns:90px 1fr 90px 1fr;align-items:start;margin:2px 0}
.fl2 label{font-weight:800;padding:4px 4px}
.fl2 input{background:#fff;border:1px solid var(--line);font-weight:600}
.fl2 label.pl{padding-left:12px}
.bill .r{padding:6px;display:flex;flex-direction:column;justify-content:center}
.bill .r label{font-weight:800;color:var(--green-d)}
.bill .r input{font-size:22px;font-weight:800;color:#555}
.fl{display:grid;grid-template-columns:90px 1fr;align-items:start;margin:2px 0}
.fl label{font-weight:800;padding:4px 4px}
.fl input,.fl textarea{background:#fff;border:1px solid var(--line);font-weight:600}
table.items{width:100%;border-collapse:collapse;border:2px solid var(--black);border-top:0}
table.items th{background:var(--black);color:#fff;padding:7px 4px;font-size:11.5px;font-weight:600;border-right:1px solid #555;letter-spacing:.6px}
table.items th:last-child{border-right:0}
table.items td{border:1px solid var(--line);padding:0;height:26px}
table.items td.c{text-align:center}
table.items tbody tr:nth-child(even){background:var(--gray)}
.n{text-align:right} .ctr{text-align:center}
.rm{background:#c0392b;color:#fff;border:0;border-radius:4px;cursor:pointer;width:22px;height:22px;font-weight:700}
.bottom{display:grid;grid-template-columns:1fr 280px;border:2px solid var(--black);border-top:0}
.terms{border-right:2px solid var(--black)}
.terms .h{background:var(--green);color:#fff;font-weight:800;padding:5px 8px;text-align:center}
.terms textarea{height:100px;padding:6px 8px;font-weight:600}
.tot div.r{display:grid;grid-template-columns:1fr 130px;border-bottom:1px solid var(--line);align-items:center;min-height:30px}
.tot .r label{padding:3px 8px;font-weight:700;background:var(--gray)}
.tot .r span,.tot .r input{padding:3px 8px;text-align:right;font-weight:700}
.tot .opt{display:grid;grid-template-columns:1fr 130px;border-bottom:1px solid var(--line);align-items:center}
.tot .opt select,.tot .opt input{padding:3px 8px;text-align:right;text-align-last:right;font-weight:700;white-space:nowrap}
.tot .opt input[type=number]{-moz-appearance:textfield}
.tot .opt input[type=number]::-webkit-outer-spin-button,.tot .opt input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tot .opt label{padding:4px 8px;font-weight:700;background:var(--gray)}
.tot .gt{background:var(--black);color:#fff;font-size:15px}
.tot .gt label{background:var(--black);color:#fff}
.words{border:2px solid var(--black);border-top:0;padding:6px 8px;background:var(--gray);font-weight:700}
.foot{border:2px solid var(--black);border-top:0;text-align:center;padding:6px}
.foot .co{font-weight:800;text-align:right;padding-right:10px}
.foot .ty{font-weight:800;font-style:italic;font-size:15px;color:var(--green-d)}
.hdr-edit input{font-weight:600}
.addrow{margin:8px 0 0;padding:6px 12px}
@media print{
  body{background:#fff} .toolbar,.noprint,#toast{display:none!important}
  .wrap{padding:0} .sheet{box-shadow:none;border:0;margin:0;width:auto;min-height:0;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  select{-webkit-appearance:none;-moz-appearance:none;appearance:none;background:none!important;box-shadow:none!important}
  @page{size:A4;margin:8mm}
}
</style>
</head>

/* ---------- toast ---------- */
function toast(msg, ms=5000){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',ms); }

/* ---------- IndexedDB (remember selected folder) ---------- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('invoiceApp',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise(res=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=res; }); }
async function idbGet(k){ const db=await idb(); return new Promise(res=>{ const r=db.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }); }

/* ---------- folder ---------- */
async function ensurePerm(h){
  if(!h) return false;
  let p = await h.queryPermission({mode:'readwrite'});
  if(p!=='granted') p = await h.requestPermission({mode:'readwrite'});
  return p==='granted';
}
async function pickFolder(){
  if(!window.showDirectoryPicker){ toast('This browser does not support saving to a folder. Please use Chrome or Edge.'); return null; }
  try{
    rootHandle = await showDirectoryPicker({mode:'readwrite'});
    await idbSet('root', rootHandle);
    $('folderInfo').textContent = '📁 Folder: ' + rootHandle.name;
    await loadCustomersFromFolder();
    await syncInvoiceNo();
    return rootHandle;
  }catch(e){ return null; }
}
async function getRoot(){
  if(rootHandle && await ensurePerm(rootHandle)) return rootHandle;
  return await pickFolder();
}

/* ---------- customers.json ---------- */
function normCust(c){
  return {
    gSTNO: String(c.gSTNO ?? c.gstno ?? c.GSTNO ?? '').toUpperCase().trim(),
    CompanyName: c.CompanyName ?? c['Company NAME'] ?? c.companyName ?? '',
    ADDRESS: c.ADDRESS ?? c.address ?? '',
    MOBILNO: c.MOBILNO ?? c.mobilno ?? c.mobile ?? '',
    PinCode: c.PinCode ?? c.pincode ?? ''
  };
}
function setCustomers(arr){
  customers = (Array.isArray(arr)?arr:[]).map(normCust).filter(c=>c.gSTNO);
  $('gstList').innerHTML = customers.map(c=>`<option value="${c.gSTNO}">${(c.CompanyName||'').replace(/"/g,'')}</option>`).join('');
  try{ localStorage.setItem('customers', JSON.stringify(customers)); }catch(e){}
}
async function loadCustomersFromFolder(){
  if(!rootHandle) return;
  try{
    const fh = await rootHandle.getFileHandle('customers.json');
    const txt = await (await fh.getFile()).text();
    setCustomers(JSON.parse(txt));
    toast('customers.json loaded: ' + customers.length + ' customers');
  }catch(e){
    if(e.name==='NotFoundError'){ await writeCustomers(); toast('New customers.json created.'); }
    else toast('Error reading customers.json: ' + e.message);
  }
}
async function writeCustomers(){
  const body = JSON.stringify(customers.map(c=>({gSTNO:c.gSTNO,CompanyName:c.CompanyName,ADDRESS:c.ADDRESS,MOBILNO:c.MOBILNO,PinCode:c.PinCode})),null,2);
  if(rootHandle && await ensurePerm(rootHandle)){
    const fh = await rootHandle.getFileHandle('customers.json',{create:true});
    const w = await fh.createWritable(); await w.write(body); await w.close();
    return true;
  }
  return false;
}
/* ---------- invoice_number.txt (last invoice no) ---------- */
async function readInvFile(){
  try{
    const fh = await rootHandle.getFileHandle('invoice_number.txt');
    const n = parseInt((await (await fh.getFile()).text()).trim(),10);
    return isNaN(n) ? null : n;
  }catch(e){ return null; }
}
async function writeInvFile(n){
  if(!rootHandle) return false;
  try{
    const fh = await rootHandle.getFileHandle('invoice_number.txt',{create:true});
    const w = await fh.createWritable(); await w.write(String(n)); await w.close();
    return true;
  }catch(e){ return false; }
}
/* read last no. from file, add 1 and put it in the invoice box */
async function syncInvoiceNo(){
  if(!rootHandle) return;
  if(await rootHandle.queryPermission({mode:'readwrite'})!=='granted') return;
  const n = await readInvFile();
  if(n===null){
    const cur = parseInt($('invNo').value,10);
    if(!isNaN(cur)) await writeInvFile(cur-1);   // create file on first use
    return;
  }
  try{ localStorage.setItem('lastInv', n); }catch(e){}
  $('invNo').value = n+1;
}
function autoFillFromGst(){
  const g = $('pGst').value.toUpperCase().trim();
  $('pGst').value = g;
  const c = customers.find(x=>x.gSTNO===g);
  if(c){
    $('pName').value=c.CompanyName; $('pAddr').value=c.ADDRESS; $('pMob').value=c.MOBILNO; $('pPin').value=c.PinCode;
    autoH($('pAddr'));
  }
}
$('pGst').addEventListener('input', autoFillFromGst);
$('pGst').addEventListener('change', autoFillFromGst);

/* Update customer data in JSON (on save) */
function upsertCustomer(){
  const g = $('pGst').value.toUpperCase().trim();
  if(!g) return false;
  const c = {gSTNO:g, CompanyName:$('pName').value.trim(), ADDRESS:$('pAddr').value.trim(), MOBILNO:$('pMob').value.trim(), PinCode:$('pPin').value.trim()};
  const i = customers.findIndex(x=>x.gSTNO===g);
  if(i>=0) customers[i]=c; else customers.push(c);
  setCustomers(customers);
  return true;
}

$('btnCust').onclick = ()=> $('custFile').click();
$('custFile').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{ setCustomers(JSON.parse(await f.text())); toast('Customers loaded: '+customers.length); }
  catch(err){ toast('Invalid JSON file: '+err.message); }
  e.target.value='';
};

/* ---------- logo ---------- */
$('logoBox').onclick = ()=> $('logoFile').click();
$('logoFile').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ setLogo(r.result); try{localStorage.setItem('logo',r.result);}catch(x){} };
  r.readAsDataURL(f);
};
function setLogo(src){ $('logoBox').innerHTML = `<img id="logoImg" src="${src}" alt="logo" style="width:100%;max-width:430px;height:auto;display:block">`; }
/* if no logo, show company name as text */
function logoFallback(){
  const img=$('logoImg');
  if(img && (img.getAttribute('src')||'').startsWith('PASTE_YOUR_LOGO')){
    $('logoBox').innerHTML='<div class="nm">SHIV SHAKTI TRADING</div><div class="tg">ASSURED OF QUALITY</div><div class="mf">MFG. of reprocesses plastic granules</div>';
  }
}

/* ---------- items ---------- */
function autoH(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }
function addRow(d={}){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td class="c"><span class="sr"></span></td>
    <td><input class="desc" value="${d.desc||''}"></td>
    <td><input class="hsn ctr" value="${d.hsn||''}"></td>
    <td><input class="qty n" type="number" step="any" value="${d.qty??''}"></td>
    <td><input class="prc n" type="number" step="any" value="${d.prc??''}"></td>
    <td class="n"><span class="rt" style="display:block;padding:3px 6px;font-weight:700">-</span></td>
    <td class="noprint c"><button class="rm" title="Row delete">×</button></td>`;
  tr.querySelector('.rm').onclick=()=>{ if($('rows').children.length>1){ tr.remove(); calc(); } else { tr.querySelectorAll('input').forEach(i=>i.value=''); calc(); } };
  tr.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));
  $('rows').appendChild(tr); calc();
}
$('btnAdd').onclick=()=>addRow();

/* ---------- calculation ---------- */
function calc(){
  let sub=0;
  [...$('rows').children].forEach((tr,i)=>{
    tr.querySelector('.sr').textContent=i+1;
    const q=parseFloat(tr.querySelector('.qty').value)||0, p=parseFloat(tr.querySelector('.prc').value)||0;
    const t=q*p; sub+=t;
    tr.querySelector('.rt').textContent = t? fmt(t) : '-';
  });
  const rate=parseFloat($('gstRate').value)||0, type=$('gstType').value;
  const tax = sub*rate/100;
  $('tSub').textContent=fmt(sub);
  const half = rate/2;
  if(type==='cgst'){
    $('rowC').style.display=$('rowS').style.display='grid'; $('rowI').style.display='none';
    $('lblC').textContent=`CGST ${half}%`; $('lblS').textContent=`SGST ${half}%`;
    $('tC').textContent=fmt(tax/2); $('tS').textContent=fmt(tax/2);
  }else{
    $('rowC').style.display=$('rowS').style.display='none'; $('rowI').style.display='grid';
    $('lblI').textContent=`IGST ${rate}%`; $('tI').textContent=fmt(tax);
  }
  const grand=sub+tax;
  $('tG').textContent=fmt(grand);
  $('words').textContent='Amount in words: '+toWords(grand);
}
['gstType','gstRate'].forEach(id=>$(id).addEventListener('input',calc));

function toWords(n){
  n=Math.round((Number(n)||0)*100)/100;
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const conv=x=>{
    if(x===0) return 'Zero';
    let s='';
    const cr=Math.floor(x/1e7); x%=1e7;
    const la=Math.floor(x/1e5); x%=1e5;
    const th=Math.floor(x/1e3); x%=1e3;
    if(cr) s+=three(cr)+' Crore ';
    if(la) s+=two(la)+' Lakh ';
    if(th) s+=two(th)+' Thousand ';
    if(x) s+=three(x);
    return s.trim();
  };
  const r=Math.floor(n), p=Math.round((n-r)*100);
  return 'Rupees '+conv(r)+(p?' and '+two(p)+' Paise':'')+' Only';
}

/* ---------- snapshot (read-only HTML for saving) ---------- */
function buildSnapshot(){
  const live=$('sheet'), clone=live.cloneNode(true);
  const lo=[...live.querySelectorAll('input,textarea,select')], co=[...clone.querySelectorAll('input,textarea,select')];
  co.forEach((el,i)=>{
    const o=lo[i]; let val=o.value;
    if(o.tagName==='SELECT') val=o.options[o.selectedIndex].text;
    if(o.type==='date' && val){ const [y,m,d]=val.split('-'); val=`${d}-${m}-${y}`; }
    const s=document.createElement('span');
    s.className=(el.className||'')+' v'; s.textContent=val;
    s.style.textAlign=getComputedStyle(o).textAlign;
    s.style.fontWeight=getComputedStyle(o).fontWeight;
    s.style.fontSize=getComputedStyle(o).fontSize;
    s.style.color=getComputedStyle(o).color;
    if(o.id==='pGst') s.style.textTransform='uppercase';
    el.replaceWith(s);
  });
  clone.querySelectorAll('.noprint').forEach(e=>e.remove());
  const css=document.querySelector('style').textContent;
  const title=($('pName').value||'Invoice')+' - '+$('invNo').value;
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title.replace(/</g,'')}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>${css}
  body{background:#fff} .sheet{box-shadow:none;margin:0 auto}</style></head><body><div class="wrap">${clone.outerHTML}</div></body></html>`;
}

/* ---------- save ---------- */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const safe = s => (s||'invoice').trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_').slice(0,60) || 'invoice';
async function saveInvoice(){
  if(!$('pName').value.trim()){ toast('Please enter Party / Company name first.'); $('pName').focus(); return; }
  const date=$('invDate').value; if(!date){ toast('Please select a date.'); return; }
  const [y,m,d]=date.split('-');
  const fileBase=`${safe($('pName').value)}_${date}`;
  upsertCustomer();
  const html=buildSnapshot();
  const invTyped = $('invNo').value;
  const root = await getRoot();
  $('invNo').value = invTyped;   // keep the number typed by the user
  if(!root){
    // fallback: download
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download=fileBase+'.html'; a.click();
    toast('No folder selected, so the file was saved to Downloads: '+fileBase+'.html');
    return;
  }
  try{
    const typeName = $('docType').value==='proforma' ? 'Proforma Invoice' : 'Tax Invoice';
    const monthName = MONTHS[parseInt(m,10)-1];
    const td=await root.getDirectoryHandle(typeName,{create:true});
    const yd=await td.getDirectoryHandle(y,{create:true});
    const md=await yd.getDirectoryHandle(monthName,{create:true});
    const dd=await md.getDirectoryHandle(d,{create:true});
    let name=fileBase+'.html';
    try{ await dd.getFileHandle(name); name=`${fileBase}_INV${safe($('invNo').value)}.html`; }catch(e){}
    const fh=await dd.getFileHandle(name,{create:true});
    const w=await fh.createWritable(); await w.write(html); await w.close();
    await writeCustomers();
    const invN = parseInt($('invNo').value,10);
    if(!isNaN(invN)) await writeInvFile(invN);
    localStorage.setItem('lastInv',$('invNo').value);
    toast(`✅ Saved\n${root.name}/${typeName}/${y}/${monthName}/${d}/${name}`);
  }catch(e){ toast('Error while saving: '+e.message); }
}

/* ---------- new invoice ---------- */
function newInvoice(){
  const last=parseInt(localStorage.getItem('lastInv')||$('invNo').value)||0;
  $('invNo').value=last+1;
  const t=new Date(); $('invDate').value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  ['pName','pAddr','pGst','pMob','pPin','remarks'].forEach(i=>$(i).value='');
  $('docType').value='tax';
  $('rows').innerHTML=''; addRow({desc:'Plastic granules',hsn:'3902'});
  $('pAddr').style.height='';
}

/* ---------- init ---------- */
$('btnFolder').onclick=pickFolder;
$('btnSave').onclick=saveInvoice;
$('btnPrint').onclick=()=>window.print();
$('btnNew').onclick=async()=>{ if(confirm('Create a new invoice? Current details will be cleared.')){ newInvoice(); await syncInvoiceNo(); } };
document.querySelectorAll('textarea').forEach(t=>t.addEventListener('input',()=>autoH(t)));

(async function init(){
  logoFallback();
  try{ const l=localStorage.getItem('logo'); if(l) setLogo(l); }catch(e){}
  try{ const c=JSON.parse(localStorage.getItem('customers')||'[]'); if(c.length) setCustomers(c); }catch(e){}
  newInvoice();
  // previously selected folder
  try{
    const h=await idbGet('root');
    if(h){ rootHandle=h; $('folderInfo').textContent='📁 Folder: '+h.name+' (permission will be asked when you click Save)';
      if(await h.queryPermission({mode:'readwrite'})==='granted'){ await loadCustomersFromFolder(); await syncInvoiceNo(); } }
  }catch(e){}
})();
</script>
